<head>
  <meta charset="UTF-8" />

  <style>
    :root{
      --bg-1:#03121f; --bg-2:#0a1e2e;
      --ice-1:#ecfeff; --ice-2:#dbeafe; --ice-3:#bae6fd;
      --text:#eef6ff; --muted:#a9c3d9;
      --accent:#38bdf8; --accent-2:#0ea5e9;
      --cyan:#67e8f9; --cyan-2:#22d3ee; --navy:#0b2440;
      --ring:0 0 18px rgba(56,189,248,.55), 0 0 32px rgba(103,232,249,.35);
      --border:1px solid rgba(186,230,253,.30);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif; color:var(--text);
      min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:12px;
      background:
        radial-gradient(1200px 800px at 5% -10%, rgba(56,189,248,.18), transparent 60%),
        radial-gradient(1200px 800px at 120% 110%, rgba(103,232,249,.16), transparent 60%),
        linear-gradient(180deg, var(--bg-1), #061a2b 65%, #04121e);
      position:relative; isolation:isolate; padding:22px 16px 42px;
    }
    body::before{
      content:""; position:fixed; inset:-20%;
      background: conic-gradient(from 200deg at 60% 40%, rgba(186,230,253,.12), rgba(34,211,238,.10), rgba(56,189,248,.14), rgba(186,230,253,.10), rgba(34,211,238,.10));
      filter:blur(48px); animation: drift 20s linear infinite; z-index:-1; opacity:.9;
    }
    @keyframes drift{0%{transform:translate3d(0,0,0) rotate(0) scale(1)}50%{transform:translate3d(-3%,1%,0) rotate(10deg) scale(1.05)}100%{transform:translate3d(0,0,0) rotate(0) scale(1)}}

    header{text-align:center}
    .title{
      margin:0; font-size:2.2rem; font-weight:900; letter-spacing:2px; text-transform:uppercase;
      background:linear-gradient(180deg, var(--ice-1), var(--ice-2) 55%, var(--ice-3));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      text-shadow:0 0 10px rgba(255,255,255,.75),0 0 24px rgba(56,189,248,.45);
    }
    .subtitle{ margin:4px 0 0; color:var(--muted); font-weight:700 }
    .progress{ margin-top:6px; font-weight:900; color:var(--ice-2) }

    .filters{
      display:flex; gap:8px; justify-content:center; align-items:center;
      margin:10px 0 0; flex-wrap:wrap;
    }
    .seg{
      appearance:none; border:1px solid rgba(186,230,253,.35);
      background:linear-gradient(180deg, #071c2c, #061725);
      color:var(--ice-1); padding:8px 12px; border-radius:12px; font-weight:900;
      cursor:pointer; box-shadow:0 6px 18px rgba(56,189,248,.20);
      transition:filter .18s ease, transform .12s ease, box-shadow .18s ease;
      white-space:nowrap;
    }
    .seg:hover{ filter:brightness(1.08); transform:translateY(-1px) }
    .seg.active{
      border-color:rgba(56,189,248,.9);
      box-shadow:0 0 0 3px rgba(56,189,248,.8), 0 0 28px rgba(56,189,248,.6);
      background:linear-gradient(180deg,#0b2a42,#08314e);
      color:var(--ice-1);
    }

    .stage{ width:min(520px, 94vw); height:400px; display:flex; align-items:center; justify-content:center; margin-top:10px; }
    .flip{ perspective:1200px; width:100%; height:100%; }
    .card{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition: transform .75s cubic-bezier(.2,.7,.2,1); }
    .flipped .card{ transform:rotateY(180deg); }

    .face{
      position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; overflow:hidden;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      text-align:center; padding:18px;
    }
    .front{ color:#0c253a; background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.88)); border:1px solid rgba(255,255,255,.65); box-shadow:0 12px 26px rgba(2,12,22,.45); }
    .back{ transform:rotateY(180deg); background: linear-gradient(180deg, rgba(10,30,46,.86), rgba(7,22,36,.94)); border:var(--border); box-shadow:var(--ring); }

    .meta-top{
      position:absolute; top:8px; left:12px; right:12px; text-align:center;
      font-weight:900; color:#000; opacity:.95; padding:4px 8px;
      border-radius:10px; border:1px solid rgba(0,0,0,.06);
      background:linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.55));
      pointer-events:none;
    }
    .ko{
      font-size:2.25rem; font-weight:900; letter-spacing:.4px;
      text-shadow:0 1px 0 rgba(255,255,255,.7); color:#0c253a;
      line-height:1.18;
      padding:0 10px;
    }
    .enhead{
      font-size:1.15rem; font-weight:900; color:var(--ice-1);
      width:min(460px,96%); text-align:left;
    }
    .enlines{ width:min(460px,96%); margin:6px auto 0; padding:0; list-style:none; text-align:left; }
    .enlines li{
      padding:10px 12px; margin:10px 0; border-radius:12px;
      background:linear-gradient(180deg, #071c2c, #061725);
      border:1px solid rgba(186,230,253,.2); color:var(--ice-2);
    }
    .enlines b{ color:var(--ice-3) }

    .controls{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:0 }
    .btn{
      appearance:none; border:none; cursor:pointer; font-weight:900; letter-spacing:.3px;
      border-radius:12px; padding:10px 14px; color:#072235;
      background:linear-gradient(90deg, var(--cyan), var(--accent));
      box-shadow:0 6px 18px rgba(56,189,248,.35);
      transition:transform .12s ease, filter .2s ease, box-shadow .2s ease;
      text-transform:uppercase;
    }
    .btn:hover{ filter:brightness(1.08); transform:translateY(-1px); box-shadow:var(--ring) }
    .ghost{ background:transparent; color:var(--ice-2); border:1px solid rgba(186,230,253,.35) }

    /* ✅ darker FLIP text (front button) */
    #flipToBack{
      color:#04121e !important;
      border-color:rgba(4,18,30,.25) !important;
    }
    #flipToBack:hover{ color:#03121f !important; }

    .play-base{
      appearance:none; border:none; cursor:pointer; border-radius:12px; padding:10px 14px;
      font-weight:900; color:#072235;
      background:linear-gradient(90deg, var(--cyan), var(--accent));
      box-shadow:0 6px 18px rgba(56,189,248,.35);
    }
    .play-base:hover{ filter:brightness(1.08) }

    .gate, .finish{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background: rgba(1,7,13,.55); backdrop-filter: blur(6px) saturate(130%);
      -webkit-backdrop-filter: blur(6px) saturate(130%); z-index:5;
    }
    .panel{
      width:min(520px,92vw);
      background: linear-gradient(180deg, rgba(10,30,46,.86), rgba(7,22,36,.94));
      border:var(--border); border-radius:16px; padding:20px; text-align:center; box-shadow:var(--ring);
    }
    .panel h2{ margin:0 0 8px; font-size:22px; font-weight:900; color:var(--ice-1) }
    .panel p{ margin:6px 0 14px; color:var(--muted); font-weight:650 }

    .floating-home{
      position: fixed; top: 0; right: 0;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
      color: #072235; font-size: 14px; font-weight: 800; text-decoration: none;
      padding: 8px 16px; border-radius: 0 0 0 10px; box-shadow: 0 6px 18px rgba(56,189,248,.35);
      z-index: 9999; transition: all 0.25s ease;
      backdrop-filter: blur(8px) saturate(140%); -webkit-backdrop-filter: blur(8px) saturate(140%);
    }
    .floating-home:hover{ filter:brightness(1.12); box-shadow: 0 0 12px rgba(56,189,248,.55), 0 0 24px rgba(103,232,249,.45); transform: translateY(-1px); }

    .flip.animating{ pointer-events:none; }
    @keyframes flyOut{ from{opacity:1; transform:translate3d(0,0,0) scale(1)} to{opacity:0; transform:translate3d(60vw,-6vh,0) rotate(8deg) scale(.96)} }
    @keyframes flyIn{ from{opacity:0; transform:translate3d(-60vw,6vh,0) rotate(-6deg) scale(.96)} to{opacity:1; transform:translate3d(0,0,0) rotate(0) scale(1)} }
    .flip.fly-exit .card{ animation: flyOut .10s cubic-bezier(.2,.7,.2,1) forwards; }
    .flip.fly-enter .card{ animation: flyIn .10s cubic-bezier(.2,.7,.2,1) forwards; }

    @media (max-width:768px){ .stage{ height:420px } .ko{ font-size:2.45rem } }
  </style>
</head>

  <header>
    <h1 class="title">VIZKOR Flip Cards</h1>

    <div class="progress" id="progress">&nbsp;</div>

  <section class="stage">
    <div class="flip" id="flipWrap" aria-live="polite">
      <div class="card" id="card" tabindex="0" aria-label="Flip card">
        <section class="face front" id="front"></section>
        <section class="face back" id="back"></section>
      </div>
    </div>
  </section>

  <div class="gate" id="gate">
    <div class="panel">
      <h2>Start Practice</h2>
      <p>Click Start to enable audio. Each card autoplays the Korean sentence once.</p>
      <div class="controls">
        <button class="btn" id="startBtn">Start (Enable Audio)</button>
      </div>
    </div>
  </div>

  <div class="finish" id="finish" style="display:none">
    <div class="panel">
      <h2>Finished! 🎉</h2>
      <p>Naubos na lahat sa level na ito. Restart to reshuffle.</p>
      <div class="controls">
        <button class="btn" id="restartBtn">Restart (Shuffle)</button>
      </div>
    </div>
  </div>

  { level:"advanced", ko:"저는 오늘 친구랑 같이 영화를 봐요", en:"I watch a movie with a friend today", tl:"Nanood ako ng movie kasama ang kaibigan ngayon" },
  { level:"advanced", ko:"저는 어제 영화관에서 영화를 봤어요", en:"I watched a movie at the cinema yesterday", tl:"Nanood ako ng movie sa sinehan kahapon" },
  { level:"advanced", ko:"저는 내일 공항에서 출발할 거예요", en:"I will depart from the airport tomorrow", tl:"Aalis ako sa airport bukas" },
  { level:"advanced", ko:"저는 내일 기차역에 도착할 거예요", en:"I will arrive at the train station tomorrow", tl:"Dumating ako sa istasyon ng tren bukas" },
  { level:"advanced", ko:"저는 오늘 버스를 타고 가요", en:"I go by bus today", tl:"Sasakay ako ng bus ngayon" },
  { level:"advanced", ko:"저는 지금 지하철을 타고 가요", en:"I go by subway now", tl:"Sasakay ako ng subway ngayon" },
  { level:"advanced", ko:"저는 오늘 택시를 타고 와요", en:"I come by taxi today", tl:"Sasakay ako ng taxi papunta dito ngayon" },
  { level:"advanced", ko:"저는 지금 사진을 많이 찍어요", en:"I take many photos now", tl:"Kumukuha ako ng maraming litrato ngayon" },
  { level:"advanced", ko:"저는 오늘 친구에게 선물을 줘요", en:"I give a gift to a friend today", tl:"Nagbibigay ako ng regalo sa kaibigan ngayon" },
  { level:"advanced", ko:"저는 어제 친구에게 도움을 줬어요", en:"I helped a friend yesterday", tl:"Tumulong ako sa kaibigan kahapon" },
  { level:"advanced", ko:"저는 지금 새로운 것을 배워요", en:"I learn something new now", tl:"May bagong akong natutunan ngayon" },
  { level:"advanced", ko:"저는 오늘 한국어를 다시 공부해요", en:"I study Korean again today", tl:"Nag-aaral ulit ako ng Korean ngayon" },
  { level:"advanced", ko:"저는 내일 일을 시작할 거예요", en:"I will start work tomorrow", tl:"Magsisimula ako magtrabaho bukas" },
  { level:"advanced", ko:"저는 오늘 일을 끝낼 거예요", en:"I will finish work today", tl:"Tatapusin ko ang trabaho ngayon" },
  { level:"advanced", ko:"저는 어제 너무 피곤해서 잤어요", en:"I was so tired yesterday that I slept", tl:"Pagod na pagod ako kahapon kaya natulog" },
  { level:"advanced", ko:"저는 오늘 저녁에 일찍 잘 거예요", en:"I will sleep early tonight", tl:"Matutulog ako nang maaga mamayang gabi" },
  { level:"advanced", ko:"저는 지금 물건을 조심히 만져요", en:"I touch the item carefully now", tl:"Hinahawakan ko nang maingat ngayon" },
  { level:"advanced", ko:"저는 지금 문을 조용히 닫아요", en:"I close the door quietly now", tl:"Isinasara ko ang pinto nang tahimik ngayon" },
  { level:"advanced", ko:"저는 오늘 창문을 열고 쉬어요", en:"I open the window and rest today", tl:"Binubuksan ko ang bintana at nagpapahinga ngayon" },
  { level:"advanced", ko:"저는 지금 불을 켜고 읽어요", en:"I turn on the light and read now", tl:"Binubuksan ko ang ilaw at nagbabasa ngayon" },
  { level:"advanced", ko:"저는 오늘 불을 끄고 잘 거예요", en:"I will turn off the light and sleep today", tl:"Papakayin ko ang ilaw at matutulog ngayon" },
  { level:"advanced", ko:"저는 지금 옷을 벗고 쉬어요", en:"I take off clothes and rest now", tl:"Nag-aalis ako ng damit at nagpapahinga ngayon" },
  { level:"advanced", ko:"저는 오늘 옷을 입고 나가요", en:"I wear clothes and go out today", tl:"Nagsusuot ako at lalabas ngayon" },
  { level:"advanced", ko:"저는 내일 친구를 만나서 말해요", en:"I meet a friend tomorrow and talk", tl:"Makikipagkita ako sa kaibigan bukas at magsasalita" },
  { level:"advanced", ko:"저는 지금 천천히 걸어서 가요", en:"I go by walking slowly now", tl:"Naglalakad ako nang dahan-dahan ngayon" },
  { level:"advanced", ko:"저는 오늘 빨리 걸어서 가요", en:"I go by walking quickly today", tl:"Naglalakad ako nang mabilis ngayon" },
  { level:"advanced", ko:"저는 어제 늦게 집에 갔어요", en:"I went home late yesterday", tl:"Late akong umuwi kahapon" },
  { level:"advanced", ko:"저는 내일 일찍 집에 갈 거예요", en:"I will go home early tomorrow", tl:"Maaga akong uuwi bukas" },
  { level:"advanced", ko:"저는 오늘 식당에서 먼저 계산해요", en:"I pay first at the restaurant today", tl:"Magbabayad muna ako sa restaurant ngayon" },
  { level:"advanced", ko:"저는 지금 식당에서 주문하고 기다려요", en:"I order and wait at the restaurant now", tl:"Umu-order ako at naghihintay sa restaurant ngayon" },
  { level:"advanced", ko:"저는 오늘 친구를 같이 도와줘요", en:"I help my friend together today", tl:"Tinutulungan ko ang kaibigan ngayon" },
  { level:"advanced", ko:"저는 오늘 집을 깨끗하게 청소해요", en:"I clean the house neatly today", tl:"Nililinis ko ang bahay nang maayos ngayon" },
  { level:"advanced", ko:"저는 오늘 빨래를 먼저 할 거예요", en:"I will do laundry first today", tl:"Maglalaba muna ako ngayon" },
    ];

    const WORD_RULES = {
      basic: { min: 2, max: 2 },
      intermediate: { min: 3, max: 4 },
      advanced: { min: 5, max: 7 },
    };

    const els = {
      gate: document.getElementById("gate"),
      finish: document.getElementById("finish"),
      startBtn: document.getElementById("startBtn"),
      restartBtn: document.getElementById("restartBtn"),
      progress: document.getElementById("progress"),
      flipWrap: document.getElementById("flipWrap"),
      cardEl: document.getElementById("card"),
      front: document.getElementById("front"),
      back: document.getElementById("back"),
      filterButtons: Array.from(document.querySelectorAll(".filters .seg")),
    };

    let audioReady = false;
    let isAnimating = false;

    let currentLevel = "basic";
    let queue = [];
    let index = 0;
    let current = null;

    function shuffle(a){
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    }

    function wordCountKo(text){
      return String(text).trim().split(/\s+/).filter(Boolean).length;
    }

    function filterByLevel(level){
      const rule = WORD_RULES[level];
      return CARDS
        .filter(c => c.level === level)
        .filter(c => {
          const n = wordCountKo(c.ko);
          return n >= rule.min && n <= rule.max;
        });
    }

    function setActiveLevelButton(level){
      els.filterButtons.forEach(btn=>{
        const active = btn.dataset.level === level;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", active ? "true" : "false");
      });
    }

    function updateProgress(){
      const total = queue.length || 0;
      els.progress.textContent = total ? `${Math.min(index+1, total)} / ${total}` : "0 / 0";
    }

    function normalizeKoForTTS(text){
      if(!text) return text;
      let out = String(text);
      out = out.replace(/\s*\(([^)]+)\)\s*/g, "$1").replace(/[()]/g, "");
      return out.replace(/\s{2,}/g, " ").trim();
    }

    function speakKo(text){
      if(!audioReady) return;
      if(!("speechSynthesis" in window)) return;

      const spoken = normalizeKoForTTS(text);
      try{ speechSynthesis.cancel(); }catch(_){}

      const u = new SpeechSynthesisUtterance(spoken);
      u.lang = "ko-KR";
      u.rate = 0.69; // ✅ slower
      speechSynthesis.speak(u);
    }

    function renderFront(c){
      els.front.innerHTML = `
        <div class="meta-top">${currentLevel.toUpperCase()} • ${wordCountKo(c.ko)} words</div>
        <div class="ko">${c.ko}</div>
        <div class="controls">
          <button class="play-base" id="replayFront" type="button">🔊 Play</button>
          <button class="btn ghost" id="flipToBack" type="button">FLIP</button>
        </div>
      `;
      els.front.querySelector("#replayFront").addEventListener("click",(e)=>{ e.stopPropagation(); speakKo(c.ko); });
      els.front.querySelector("#flipToBack").addEventListener("click",(e)=>{ e.stopPropagation(); els.flipWrap.classList.add("flipped"); });
    }

    function renderBack(c){
      els.back.innerHTML = `
        <div class="enhead">${c.ko}</div>
        <ul class="enlines">
          <li><b>English</b><br>${escapeHtml(c.en)}</li>
          <li><b>Tagalog</b><br>${escapeHtml(c.tl)}</li>
        </ul>
        <div class="controls" style="margin-top:4px">
          <button class="btn ghost" id="flipToFront" type="button">◀ BACK</button>
          <button class="btn" id="nextBtn" type="button">NEXT ▶</button>
          <button class="btn ghost" id="replayBack" type="button">🔊 REPLAY</button>
        </div>
      `;
      els.back.querySelector("#flipToFront").addEventListener("click",(e)=>{ e.stopPropagation(); els.flipWrap.classList.remove("flipped"); });
      els.back.querySelector("#nextBtn").addEventListener("click",(e)=>{ e.stopPropagation(); nextCardAnimated(); });
      els.back.querySelector("#replayBack").addEventListener("click",(e)=>{ e.stopPropagation(); speakKo(c.ko); });
    }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function showCard(c){
      current = c;
      renderFront(c);
      renderBack(c);
      els.flipWrap.classList.remove("flipped");
      updateProgress();
      speakKo(c.ko);
    }

    function showEmpty(){
      current = null;
      els.flipWrap.classList.remove("flipped");
      els.front.innerHTML = `
        <div class="meta-top">Empty</div>
        <div class="ko" style="color:#789; text-shadow:none">— No cards —</div>
      `;
      els.back.innerHTML = ``;
      els.finish.style.display = "none";
      els.progress.textContent = "0 / 0";
    }

    function startRun(){
      els.finish.style.display = "none";
      queue = shuffle(filterByLevel(currentLevel));
      index = 0;
      if(queue.length) showCard(queue[index]);
      else showEmpty();
    }

    function nextCardAnimated(){
      if(isAnimating) return;
      isAnimating = true;

      els.flipWrap.classList.add("animating","fly-exit");

      const onExitEnd = (e)=>{
        if(e.target !== els.cardEl) return;
        els.flipWrap.removeEventListener("animationend", onExitEnd);
        els.flipWrap.classList.remove("fly-exit");

        index++;
        if(index >= queue.length){
          els.flipWrap.classList.remove("animating");
          isAnimating = false;
          els.finish.style.display = "flex";
          return;
        }

        const c = queue[index];
        renderFront(c);
        renderBack(c);
        els.flipWrap.classList.remove("flipped");
        updateProgress();

        els.flipWrap.classList.add("fly-enter");
        const onEnterEnd = (ev)=>{
          if(ev.target !== els.cardEl) return;
          els.flipWrap.removeEventListener("animationend", onEnterEnd);
          els.flipWrap.classList.remove("fly-enter","animating");
          isAnimating = false;
          speakKo(c.ko);
        };
        els.flipWrap.addEventListener("animationend", onEnterEnd);
      };

      els.flipWrap.addEventListener("animationend", onExitEnd);
    }

    function applyLevel(level){
      currentLevel = level;
      setActiveLevelButton(level);
      startRun();
    }

    function wireEvents(){
      els.filterButtons.forEach(btn=>{
        btn.addEventListener("click",(e)=>{
          e.preventDefault();
          applyLevel(btn.dataset.level);
        });
      });

      els.flipWrap.addEventListener("click", ()=>{
        if(!current) return;
        if(!els.flipWrap.classList.contains("flipped")) els.flipWrap.classList.add("flipped");
        else nextCardAnimated();
      });

      els.cardEl.addEventListener("keydown",(e)=>{
        if(e.code === "Enter" || e.code === "Space"){
          e.preventDefault();
          if(!current) return;
          if(!els.flipWrap.classList.contains("flipped")) els.flipWrap.classList.add("flipped");
          else nextCardAnimated();
        }
      });

      els.startBtn.addEventListener("click", ()=>{
        audioReady = true;
        els.gate.style.display = "none";
        startRun();
      });

      els.restartBtn.addEventListener("click", ()=>{
        audioReady = true;
        els.gate.style.display = "none";
        startRun();
      });
    }

    wireEvents();
    applyLevel("basic");
  </script>

  <script>
    document.addEventListener("contextmenu", e=>e.preventDefault(), false);
    document.addEventListener("selectstart", e=>e.preventDefault(), false);
    document.addEventListener("dragstart", e=>e.preventDefault(), false);
    document.addEventListener("keydown", function(e){
      if (e.key === "F12" || (e.ctrlKey && ["u","s","c","x","v"].includes(e.key.toLowerCase()))) e.preventDefault();
    }, false);
  </script>
</body>
</html>
