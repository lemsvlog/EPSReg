plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vizkor.koreanlockstudy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vizkor.koreanlockstudy'
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
