name: Audit V1 Vocabulary

on:
  push:
    branches: [agent/vocabulary-v1-full-correction]
    paths:
      - 'scripts/audit-vocabulary-v1.mjs'
      - '.github/workflows/vocabulary-v1-audit.yml'
      - 'noun.js'
      - 'verb.js'
      - 'adjective.js'
      - 'adverb.html'
      - 'number.html'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run V1 vocabulary audit
        run: node scripts/audit-vocabulary-v1.mjs
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/VIZKOR_V1_Full_Vocabulary_Audit.txt
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Generate V1 full vocabulary audit"
            git push
          fi
