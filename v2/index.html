<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#0a377e,#071f4c);padding:18px 14px;color:#fff}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 20px}.mark{width:48px;height:48px;border-radius:15px;background:#fff;color:#0a377e;display:grid;place-items:center;font-weight:900;font-size:22px}.brand b,.brand small{display:block}.brand small{opacity:.7;margin-top:3px}.navTitle{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;opacity:.55;margin:14px 10px 6px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#dbeaff;padding:10px 12px;border-radius:11px;text-align:left;cursor:pointer}.nav button:hover,.nav button.active{background:rgba(255,255,255,.14);color:#fff}.main{min-width:0}.topbar{height:70px;position:sticky;top:0;z-index:8;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.topbar b,.topbar small{display:block}.topbar small{color:var(--muted);margin-top:2px}.actions{display:flex;gap:8px}.icon{width:40px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;cursor:pointer}.menu{display:none}.content{max-width:1240px;margin:auto;padding:24px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#092d6b,#1676d2 68%,#18a7d4);color:#fff;padding:30px;border-radius:26px;box-shadow:var(--shadow)}.hero:after{content:'한';position:absolute;right:22px;top:-52px;font-size:210px;font-weight:900;opacity:.08}.hero h1{font-size:30px;margin:0 0 8px}.hero p{max-width:780px;line-height:1.6;opacity:.9}.status{display:inline-flex;gap:7px;align-items:center;margin-top:12px;padding:7px 10px;background:rgba(255,255,255,.14);border-radius:999px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#ffd166}.dot.ready{background:#55e08f}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,1fr);margin:16px 0}.card,.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:18px}.stat .n{font-size:27px;font-weight:900;margin:6px 0}.muted{color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:end;margin:26px 0 12px}.section h2{margin:0;font-size:20px}.quick{grid-template-columns:repeat(4,1fr)}.quick .card{padding:18px;cursor:pointer;transition:.15s}.quick .card:hover{transform:translateY(-2px)}.quick h3{margin:8px 0 5px}.emoji{font-size:27px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.input,.select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:11px 13px;outline:none}.input{min-width:230px;flex:1}.select{min-width:145px}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--blue2);color:#fff;font-weight:800;cursor:pointer}.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn.bad{background:#fee8e7;color:#9f2c28}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:10px}.vgrid{grid-template-columns:repeat(3,1fr)}.vcard{padding:16px;position:relative}.ko{font-size:24px;font-weight:900;padding-right:65px}.meaning{margin-top:8px;line-height:1.45}.miniActions{position:absolute;right:10px;top:10px;display:flex;gap:4px}.mini{border:0;background:transparent;font-size:17px;cursor:pointer}.forms{margin-top:11px;padding:10px;border-radius:11px;background:var(--panel2);font-size:12px;line-height:1.7}.pager{display:flex;align-items:center;justify-content:center;gap:9px;margin:18px 0}.quizWrap{max-width:760px;margin:auto}.qcard{padding:2 @media(max-width:620px){.content{padding:13px}.topbar{padding:0 12px}.stats,.quick,.vgrid,.skillGrid{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:25px}.qcard{padding:20px}.qmain{font-size:31px}.flash .big{font-size:41px}.titleSmall{display:none}}

<main class="main"><header class="topbar"><button class="icon menu" id="menu">☰</button><div><b id="pageTitle">Dashboard</b><small class="titleSmall" id="pageSub">Loading full EPSReg banks…</small></div><div class="actions"><button class="icon" id="randomAudio" title="Random Korean audio">🔊</button><button class="icon" id="theme">◐</button></div></header><div class="content" id="content"></div></main>
</div>
<script src="repo-sync.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const data=()=>window.VIZKOR_DATA||{vocab:[],sentences:[],nouns:[],verbs:[],adjectives:[],adverbs:[],expressions:[],keywords:[]};
let S={view:'dashboard',q:'',book:'ALL',pos:'ALL',page:1,per:60,flash:0,reveal:false,quiz:null,listen:null,numMode:'native',sentenceLevel:'ALL'};
const P=()=>LS.g('vizkor_v2_progress',{answered:0,correct:0,wrong:{},fav:{},mastered:{},daily:{}}),save=p=>LS.s('vizkor_v2_progress',p),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),shuffle=a=>[...a].sort(()=>Math.random()-.5),pick=a=>a[Math.floor(Math.random()*a.length)];
function title(a,b='EPS-TOPIK Learning App'){$('#pageTitle').textContent=a;$('#pageSub').textContent=b}
function speak(t){if(!t||!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.84;let vs=speechSynthesis.getVoices(),v=vs.find(x=>/^ko/i.test(x.lang)||/Korean/i.test(x.name));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}
function go(v){S.view=v;S.page=1;$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#sidebar').classList.remove('open');render()}
$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#theme').onclick=()=>{document.body.classList.toggle('dark');LS.s('vizkor_dark',document.body.classList.contains('dark'))};if(LS.g('vizkor_dark',false))document.body.classList.add('dark');$$('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));$('#randomAudio').onclick=()=>{let a=data().vocab;if(a.length)speak(pick(a).ko)};
document.addEventListener('click',e=>{let g=e.target.closest('[data-go]');if(g)go(g.dataset.go);let sp=e.target.closest('[data-speak]');if(sp)speak(sp.dataset.speak);let f=e.target.closest('[data-fav]');if(f){let p=P(),k=f.dataset.fav;p.fav[k]=!p.fav[k];save(p);render()}});
function key(v){return v.ko+'|'+v.en+'|'+(v.book||'')+'|'+(v.pos||'')}
function card(v){let p=P(),k=key(v);return `<div class="card vcard"><div class="miniActions"><button class="mini" data-fav="${esc(k)}">${p.fav[k]?'❤️':'♡'}</button><button class="mini" data-speak="${esc(v.ko)}">🔊</button></div><div class="ko">${esc(v.ko)}</div><div class="meaning"><b>${esc(v.en)}</b>${v.tl?`<br><span class="muted">${esc(v.tl)}</span>`:''}</div><div class="pills"><span class="pill">${esc(v.book||'GENERAL')}</span><span class="pill">${esc(v.pos||'Vocabulary')}</span>${v.page?`<span class="pill">Page ${v.page}</span>`:''}${v.category?`<span class="pill">${esc(v.category)}</span>`:''}</div>${v.present?`<div class="forms"><b>Present:</b> ${esc(v.present.ko||'')}<br><b>Past:</b> ${esc(v.past?.ko||'')}<br><b>Future:</b> ${esc(v.future?.ko||'')}</div>`:''}</div>`}
function dashboard(){let D=data(),p=P(),acc=p.answered?Math.round(p.correct/p.answered*100):0,st=window.VIZKOR_REPO_STATUS||{},c=st.counts||{};title('Dashboard',st.state==='ready'?`${D.vocab.length} vocabulary entries loaded`:'Loading full EPSReg banks…');let daily=shuffle(D.vocab).slice(0,6);return `<div class="hero"><h1>VIZKOR Full EPS-TOPIK Reviewer</h1><p>Book 1 + Book 2 vocabulary, Korean meanings, Tagalog support, conjugations, greetings, EPS keywords, sentences, listening, quizzes and progress — combined into one standalone V2.</p><div class="status"><span class="dot ${st.state==='ready'?'ready':''}"></span>${st.state==='ready'?'Repository data ready':'Syncing repository data'}</div></div><div class="grid stats"><div class="stat"><span class="muted">Vocabulary</span><div class="n">${D.vocab.length}</div></div><div class="stat"><span class="muted">Nouns</span><div class="n">${c.nouns||D.nouns.length}</div></div><div class="stat"><span class="muted">Verbs</span><div class="n">${c.verbs||D.verbs.length}</div></div><div class="stat"><span class="muted">Sentences</span><div class="n">${D.sentences.length}</div></div><div class="stat"><span class="muted">Accuracy</span><div class="n">${acc}%</div></div></div><div class="section"><h2>Study Center</h2><small class="muted">Choose a mode</small></div><div class="grid quick">${[['vocab','📚','Vocabulary','Full Book 1 + Book 2 searchable list'],['verbs','⚙️','Verb Conjugation','Base, present, past and future'],['flash','🃏','Flashcards','Random memory training'],['quiz','🧠','Quiz','Four choices + wrong answer review'],['listening','🔊','Listening','Hear Korean before choosing'],['numbers','🔢','Numbers','Native, Sino, time and counters'],['sentences','📝','Sentences','Basic to advanced practice'],['reading','📖','EPS Keywords','High-frequency exam words']].map(x=>`<div class="card" data-go="${x[0]}"><div class="emoji">${x[1]}</div><h3>${x[2]}</h3><div class="muted">${x[3]}</div></div>`).join('')}</div><div class="section"><h2>Daily 6</h2><small class="muted">Quick warm-up</small></div><div class="grid vgrid">${daily.map(card).join('')}</div>`}
function listView(kind,titleText){let D=data(),arr=kind==='vocab'?D.vocab:D[kind]||[];let posMap={nouns:'Noun',verbs:'Verb',adjectives:'Adjective',adverbs:'Adverb',expressions:'Expression'};if(kind!=='vocab'&&!arr.length&&posMap[kind])arr=D.vocab.filter(v=>v.pos===posMap[kind]);let filtered=arr.filter(v=>(S.book==='ALL'||v.book===S.book)&&(!S.q||[v.ko,v.en,v.tl,v.category,v.pos,v.page].join(' ').toLowerCase().includes(S.q.toLowerCase())));let pages=Math.max(1,Math.ceil(filtered.length/S.per));S.page=Math.min(S.page,pages);let shown=filtered.slice((S.page-1)*S.per,S.page*S.per);title(titleText,`${filtered.length} matching entries`);return `<div class="controls"><input class="input" id="search" placeholder="Search Korean, English, Tagalog…" value="${esc(S.q)}"><select class="select" id="book"><option>ALL</option><option>B1</option><option>B2</option><option>GENERAL</option></select><button class="btn sec" id="randomWord">🔀 Random</button></div><div class="grid vgrid">${shown.map(card).join('')||'<div class="empty">No matching entries.</div>'}</div><div class="pager"><button class="btn sec" id="prevPage">←</button><b>${S.page} / ${pages}</b><button class="btn sec" id="nextPage">→</button></div>`}
function bindList(){let s=$('#search'),b=$('#book');b.value=S.book;s.oninput=()=>{S.q=s.value;S.page=1;render()};b.onchange=()=>{S.book=b.value;S.page=1;render()};$('#randomWord').onclick=()=>{let a=data().vocab;if(a.length)speak(pick(a).ko)};$('#prevPage').onclick=()=>{S.page=Math.max(1,S.page-1);render()};$('#nextPage').onclick=()=>{S.page++;render()}}
function makeQ(pool=data().vocab){if(!pool.length)return null;let v=pick(pool),others=shuffle(data().vocab.filter(x=>x.en!==v.en)).slice(0,3);return {v,opts:shuffle([v,...others]),done:false}}
function quiz(listen=false){let k=listen?'listen':'quiz';if(!S[k])S[k]=makeQ();let q=S[k];title(listen?'Listening Quiz':'4-Choice Quiz',listen?'Listen first, then choose':'Korean → English meaning');if(!q)return '<div class="empty">Loading vocabulary…</div>';return `<div class="quizWrap"><div class="card qcard"><div class="muted">${listen?'Press play and listen carefully':'Choose the correct meaning'}</div><div class="qmain">${listen?'🔊 듣기':esc(q.v.ko)}</div><p><button class="btn sec" id="playQ" data-speak="${esc(q.v.ko)}">🔊 Play Korean</button></p><div class="choices">${q.opts.map((x,i)=>`<button class="choice" data-answer="${esc(x.en)}">${String.fromCharCode(65+i)}. ${esc(x.en)}</button>`).join('')}</div><div id="feedback"></div></div></div>`}
function answer(btn,q,mode){if(q.done)return;q.done=true;let ok=btn.dataset.answer===q.v.en,p=P(),k=key(q.v);p.answered++;if(ok){p.correct++;p.mastered[k]=(p.mastered[k]||0)+1;delete p.wrong[k]}else p.wrong[k]=q.v;save(p);$$('.choice').forEach(x=>{if(x.dataset.answer===q.v.en)x.classList.add('good');else if(x===btn)x.classList.add('bad');x.disabled=true});$('#feedback').innerHTML=`<div class="notice" style="margin-top:12px">${ok?'✅ Correct':`❌ Correct answer: <b>${esc(q.v.en)}</b>`}<br><br><button class="btn" id="nextQ">Next Question</button></div>`;$('#nextQ').onclick=()=>{S[mode]=makeQ();render()}}
function bindQuiz(listen){let mode=listen?'listen':'quiz',q=S[mode];$$('.choice').forEach(b=>b.onclick=()=>answer(b,q,mode))}
function flash(){let a=data().vocab;if(!a.length)return '<div class="empty">Loading vocabulary…</div>';S.flash=Math.min(S.flash,a.length-1);let v=a[S.flash];title('Flashcards','Tap the card to reveal');return `<div class="controls"><button class="btn sec" id="prevFlash">← Previous</button><button class="btn" id="shuffleFlash">Shuffle</button><button class="btn sec" id="nextFlash">Next →</button></div><div class="card flash ${S.reveal?'reveal':''}" id="flashCard"><div><div class="big">${esc(v.ko)}</div><div class="muted">${S.reveal?esc(v.pos||'Vocabulary'):'Tap to reveal'}</div><div class="answer"><h2>${esc(v.en)}</h2><div class="muted">${esc(v.tl||'')}</div>${v.present?`<div class="forms"><b>Present:</b> ${esc(v.present.ko||'')}<br><b>Past:</b> ${esc(v.past?.ko||'')}<br><b>Future:</b> ${esc(v.future?.ko||'')}</div>`:''}<p><button class="btn" data-speak="${esc(v.ko)}">🔊 Hear Korean</button></p></div></div></div>`}
function bindFlash(){let a=data().vocab;$('#flashCard').onclick=e=>{if(e.target.closest('button'))return;S.reveal=!S.reveal;render()};$('#prevFlash').onclick=()=>{S.flash=(S.flash-1+a.length)%a.length;S.reveal=false;render()};$('#nextFlash').onclick=()=>{S.flash=(S.flash+1)%a.length;S.reveal=false;render()};$('#shuffleFlash').onclick=()=>{S.flash=Math.floor(Math.random()*a.length);S.reveal=false;render()}}
const nativeNames=['영','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열','열하나','열둘','열셋','열넷','열다섯','열여섯','열일곱','열여덟','열아홉'];function native(n){if(n<20)return nativeNames[n];let t=['','','스물','서른','마흔','쉰','예순','일흔','여든','아흔'];return t[Math.floor(n/10)]+(n%10?nativeNames[n%10]:'')}function sino(n){if(n===0)return'영';let d=['','일','이','삼','사','오','육','칠','팔','구'],o='';for(let[u,w]of[[10000,'만'],[1000,'천'],[100,'백'],[10,'십']]){let q=Math.floor(n/u);if(q){o+=(q===1?'':sino(q))+w;n%=u}}return o+(n?d[n]:'')}
function numbers(){let n=1+Math.floor(Math.random()*(S.numMode==='native'?98:999)),ans=S.numMode==='native'?native(n):sino(n);if(S.numMode==='time'){let h=1+Math.floor(Math.random()*12),m=Math.floor(Math.random()*60);n=h+':'+String(m).padStart(2,'0');ans=native(h)+' 시 '+(m?sino(m)+' 분':'')}if(S.numMode==='counter'){let x=1+Math.floor(Math.random()*20),sp={1:'한',2:'두',3:'세',4:'네',20:'스무'};n=x+' people';ans=(sp[x]||native(x))+' 명'}title('Number Trainer','Native • Sino • Time • Counters');return `<div class="tabs">${[['native','Native'],['sino','Sino'],['time','Time'],['counter','Counters']].map(x=>`<button data-num="${x[0]}" class="${S.numMode===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="card numberBox"><div class="num">${esc(n)}</div><button class="btn" id="showNum">Show Korean</button><div id="numAnswer" style="display:none"><h2>${esc(ans)}</h2><button class="btn sec" data-speak="${esc(ans)}">🔊 Hear</button> <button class="btn" id="nextNum">Next</button></div></div>`}
function bindNumbers(){$$('[data-num]').forEach(b=>b.onclick=()=>{S.numMode=b.dataset.num;render()});$('#showNum').onclick=()=>{$('#showNum').style.display='none';$('#numAnswer').style.display='block'};let n=$('#nextNum');if(n)n.onclick=render}
function sentences(){let a=data().sentences.filter(x=>S.sentenceLevel==='ALL'||x.level===S.sentenceLevel);title('Sentence Practice',`${a.length} ${S.sentenceLevel==='ALL'?'sentences':S.sentenceLevel+' sentences'}`);return `<div class="tabs">${[['ALL','All'],['basic','Basic'],['intermediate','Intermediate'],['advanced','Advanced']].map(x=>`<button data-level="${x[0]}" class="${S.sentenceLevel===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="grid vgrid">${a.slice(0,400).map(x=>`<div class="card vcard"><div class="miniActions"><button class="mini" data-speak="${esc(x.ko)}">🔊</button></div><div class="ko">${esc(x.ko)}</div><div class="meaning"><b>${esc(x.en)}</b><br><span class="muted">${esc(x.tl||'')}</span></div><span class="pill">${esc(x.level)}</span></div>`).join('')||'<div class="empty">No sentences loaded.</div>'}</div>`}
function bindSentences(){$$('[data-level]').forEach(b=>b.onclick=()=>{S.sentenceLevel=b.dataset.level;render()})}
function reading(){let a=data().keywords;title('EPS Reading Keywords',`${a.length} high-frequency keywords`);return `<div class="notice"><b>Exam strategy:</b> identify question keywords first, then scan for numbers, time, place, negatives and safety/prohibition words.</div><div class="tableWrap" style="margin-top:14px"><table><thead><tr><th>Korean</th><th>English</th><th>Tagalog</th><th>Frequency</th><th>Example</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.ko)}</b> <button class="mini" data-speak="${esc(x.ko)}">🔊</button></td><td>${esc(x.en)}</td><td>${esc(x.tl)}</td><td>${x.count||''}</td><td>${esc(x.koSentence||'')}</td></tr>`).join('')}</tbody></table></div>`}
function review(fav){let p=P(),arr=fav?data().vocab.filter(v=>p.fav[key(v)]):Object.values(p.wrong);title(fav?'Favorites':'Wrong Answers',`${arr.length} saved terms`);return `<div class="grid vgrid">${arr.map(card).join('')||'<div class="empty">Nothing here yet.</div>'}</div>`}
function progress(){let p=P(),acc=p.answered?Math.round(p.correct/p.answered*100):0,mastered=Object.keys(p.mastered).length,total=Math.max(1,data().vocab.length),pct=Math.min(100,Math.round(mastered/total*100));title('Progress','Saved locally on this device');return `<div class="grid stats"><div class="stat"><span class="muted">Answered</span><div class="n">${p.answered}</div></div><div class="stat"><span class="muted">Correct</span><div class="n">${p.correct}</div></div><div class="stat"><span class="muted">Accuracy</span><div class="n">${acc}%</div></div><div class="stat"><span class="muted">Mastered</span><div class="n">${mastered}</div></div><div class="stat"><span class="muted">Weak Words</span><div class="n">${Object.keys(p.wrong).length}</div></div></div><div class="card" style="padding:20px"><b>Vocabulary Mastery</b><p class="muted">${mastered} of ${total} terms answered correctly at least once</p><div class="progressLine"><span style="width:${pct}%"></span></div><p><button class="btn bad" id="resetProgress">Reset Progress</button></p></div>`}
function skills(){title('EPS Skill Test Center','Original specialized practice modules');let x=[['Command Practice','../skilltest-command.html','Practice workplace commands'],['Interview Practice','../skilltest-interview.html','EPS interview preparation'],['Signs Practice','../skilltest-sign.html','Safety and workplace signs'],['Tools Practice','../skilltest-tools.html','Tools and equipment recognition'],['Reading Master Guide','../readingguide.html','Full reading exam guide'],['Numbers Full Trainer','../number.html','Original advanced number trainer']];return `<div class="grid skillGrid">${x.map(i=>`<div class="card skill"><h3>${i[0]}</h3><p class="muted">${i[2]}</p><a class="btn" href="${i[1]}" target="_blank">Open Module</a></div>`).join('')}</div>`}
function bind(){if(['vocab','nouns','verbs','adjectives','adverbs','expressions'].includes(S.view))bindList();if(S.view==='flash')bindFlash();if(S.view==='quiz')bindQuiz(false);if(S.view==='listening')bindQuiz(true);if(S.view==='numbers')bindNumbers();if(S.view==='sentences')bindSentences();if(S.view==='progress')$('#resetProgress').onclick=()=>{if(confirm('Reset all V2 progress?')){localStorage.removeItem('vizkor_v2_progress');render()}}}
function render(){let h='';if(S.view==='dashboard')h=dashboard();else if(S.view==='vocab')h=listView('vocab','All Vocabulary');else if(S.view==='nouns')h=listView('nouns','Korean Nouns');else if(S.view==='verbs')h=listView('verbs','Korean Verbs + Conjugations');else if(S.view==='adjectives')h=listView('adjectives','Korean Adjectives + Conjugations');else if(S.view==='adverbs')h=listView('adverbs','Korean Adverbs');else if(S.view==='expressions')h=listView('expressions','Greetings & Situational Phrases');else if(S.view==='flash')h=flash();else if(S.view==='quiz')h=quiz(false);else if(S.view==='listening')h=quiz(true);else if(S.view==='numbers')h=numbers();else if(S.view==='sentences')h=sentences();else if(S.view==='reading')h=reading();else if(S.view==='wrong')h=review(false);else if(S.view==='favorites')h=review(true);else if(S.view==='progress')h=progress();else h=skills();$('#content').innerHTML=h;bind()}
window.addEventListener('vizkor:data-ready',render);render();
})();
</script>
</body></html>
