<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.shell{display:grid;grid-template-columns:268px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#0a377e,#071f4c);padding:18px 14px;color:#fff;z-index:30}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 20px}.mark{width:48px;height:48px;border-radius:15px;background:#fff;color:#0a377e;display:grid;place-items:center;font-weight:900;font-size:22px;overflow:hidden}.mark img{width:100%;height:100%;object-fit:cover}.brand b,.brand small{display:block}.brand small{opacity:.72;margin-top:3px}.version{display:inline-block;margin-top:4px;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.12);font-size:9px}.navTitle{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;opacity:.55;margin:14px 10px 6px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#dbeaff;padding:10px 12px;border-radius:11px;text-align:left;cursor:pointer}.nav button:hover,.nav button.active{background:rgba(255,255,255,.14);color:#fff}.main{min-width:0}.topbar{height:70px;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.topbar b,.topbar small{display:block}.topbar small{color:var(--muted);margin-top:2px}.actions{display:flex;gap:8px}.icon{width:40px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;cursor:pointer}.menu{display:none}.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}.backdrop.show{display:block}.content{max-width:1240px;margin:auto;padding:24px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#092d6b,#1676d2 68%,#18a7d4);color:#fff;padding:30px;border-radius:26px;box-shadow:var(--shadow)}.hero:after{content:'한';position:absolute;right:22px;top:-52px;font-size:210px;font-weight:900;opacity:.08}.hero h1{font-size:30px;margin:0 0 8px}.hero p{max-width:800px;line-height:1.6;opacity:.92}.status{display:inline-flex;gap:7px;align-items:center;margin-top:12px;padding:7px 10px;background:rgba(255,255,255,.14);border-radius:999px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#ffd166}.dot.ready{background:#55e08f}.dot.error{background:#ff7b72}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,1fr);margin:16px 0}.card,.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:18px}.stat .n{font-size:27px;font-weight:900;margin:6px 0}.muted{color:var(--muted)}.small{font-size:12px}.section{display:flex;justify-content:space-between;align-items:end;margin:26px 0 12px}.section h2{margin:0;font-size:20px}.quick{grid-template-columns:repeat(4,1fr)}.quick .card{padding:18px;cursor:pointer;transition:.15s}.quick .card:hover{transform:translateY(-2px)}.quick h3{margin:8px 0 5px}.emoji{font-size:27px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.input,.select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:11px 13px;outline:none}.input{min-width:220px;flex:1}.select{min-width:135px}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--blue2);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn.bad{background:#fee8e7;color:#9f2c28}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:10px}.vgrid{grid-template-columns:repeat(3,1fr)}.vcard{padding:16px;position:relative}.ko{font-size:24px;font-weight:900;padding-right:66px;word-break:keep-all}.meaning{margin-top:8px;line-height:1.45}.miniActions{position:absolute;right:10px;top:10px;display:flex;gap:4px}.mini{border:0;background:transparent;color:inherit;font-size:17px;cursor:pointer}.forms{margin-top:11px;padding:10px;border-radius:11px;background:var(--panel2);font-size:12px;line-height:1.7}.pager{display:flex;align-items:center;justify-content:center;gap:9px;margin:18px 0}.quizWrap{max-width:780px;margin:auto}.qcard{padding:28px}.qmain{font-size:38px;font-weight:900;margin:13px 0;word-break:keep-all}.choices{display:grid;gap:9px}.choice{width:100%;padding:14px;text-align:left;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--ink);cursor:pointer}.choice.good{background:#eefcf4;border-color:#8bd8aa;color:#165934}.choice.bad{background:#fff1f0;border-color:#efb0ac;color:#7d2925}.flash{min-height:360px;display:grid;place-items:center;text-align:center;padding:30px;cursor:pointer}.flash .big{font-size:50px;font-weight:900;word-break:keep-all}.flash .answer{display:none;margin-top:18px}.flash.reveal .answer{display:block}.numberBox{text-align:center;padding:34px}.numberBox .num{font-size:58px;font-weight:900}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 11px;border-radius:99px;cursor:pointer}.tabs button.active{background:var(--blue2);color:#fff}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:var(--panel)}table{width:100%;border-collapse:collapse}th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:var(--panel2);color:var(--muted);font-size:11px;position:sticky;top:0}.notice{padding:14px;border:1px solid #f1cd70;background:#fff8df;color:#6b4b00;border-radius:13px;line-height:1.5}.dark .notice{background:#302713;color:#ffe39b;border-color:#66541f}.errorBox{padding:14px;border:1px solid #efb0ac;background:#fff1f0;color:#7d2925;border-radius:13px}.dark .errorBox{background:#381d1d;color:#ffc9c5;border-color:#743838}.skillGrid{grid-template-columns:repeat(2,1fr)}.skill{padding:19px}.progressLine{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.progressLine span{height:100%;display:block;background:linear-gradient(90deg,var(--blue2),var(--cyan))}.empty{text-align:center;color:var(--muted);padding:40px}.footer{font-size:11px;color:var(--muted);line-height:1.5;margin:22px 0}.healthGrid{grid-template-columns:repeat(3,1fr)}.sourceOk{color:var(--good);font-weight:800}.sourceBad{color:var(--bad);font-weight:800}.bookCards{grid-template-columns:repeat(2,1fr)}.bookCard{padding:20px}.bookCard h3{margin-top:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--panel2);font-size:11px;color:var(--muted)}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.quick{grid-template-columns:repeat(3,1fr)}.healthGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:880px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-285px;width:268px;z-index:30;transition:.2s}.sidebar.open{left:0}.menu{display:inline-grid;place-items:center}.vgrid,.quick{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.content{padding:13px}.topbar{padding:0 12px}.stats,.quick,.vgrid,.skillGrid,.healthGrid,.bookCards{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:25px}.qcard{padding:20px}.qmain{font-size:31px}.flash .big{font-size:41px}.titleSmall{display:none}.input,.select{width:100%;min-width:0}.controls .btn{flex:1}.numberBox .num{font-size:44px}}
</style>

</div>
<script src="repo-sync.js?v=2.1.0"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const emptyData={vocab:[],sentences:[],nouns:[],verbs:[],adjectives:[],adverbs:[],expressions:[],keywords:[],meta:{byBook:{},byPos:{}}};
const data=()=>window.VIZKOR_DATA||emptyData;
let S={view:'dashboard',q:'',book:'ALL',pos:'ALL',category:'ALL',page:1,per:60,flashIndex:0,flashReveal:false,flashBook:'ALL',flashPos:'ALL',quiz:null,listen:null,quizBook:'ALL',quizPos:'ALL',numMode:'native',numQuestion:null,sentenceLevel:'ALL',sentenceQ:'',sentencePage:1,sentencePer:60,keywordQ:'',keywordPage:1,keywordPer:80};
const P=()=>LS.g('vizkor_v2_progress',{answered:0,correct:0,wrong:{},fav:{},mastered:{}}),save=p=>LS.s('vizkor_v2_progress',p);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/\s+/g,' ').trim();
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const pick=a=>a?.length?a[Math.floor(Math.random()*a.length)]:null;
const unique=(a,keyFn)=>{const seen=new Set();return a.filter(x=>{const k=keyFn(x);if(seen.has(k))return false;seen.add(k);return true})};
function key(v){return [clean(v.ko),clean(v.en),v.book||'',v.pos||''].join('|')}
function title(a,b='EPS-TOPIK Learning App'){$('#pageTitle').textContent=a;$('#pageSub').textContent=b}
let voices=[];
function refreshVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices()||[]}
refreshVoices();if('speechSynthesis'in window)speechSynthesis.addEventListener?.('voiceschanged',refreshVoices);
function koreanVoice(){refreshVoices();const preferred=LS.g('vizkor_ko_voice','');return voices.find(v=>v.name===preferred)||voices.find(v=>/^ko(-|_)?/i.test(v.lang))||voices.find(v=>/Korean/i.test(v.name))||null}
function speak(t){if(!t||!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.84;const v=koreanVoice();if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}
function setSidebar(open){$('#sidebar').classList.toggle('open',open);$('#backdrop').classList.toggle('show',open)}
$('#menu').onclick=()=>setSidebar(!$('#sidebar').classList.contains('open'));$('#backdrop').onclick=()=>setSidebar(false);
$('#theme').onclick=()=>{document.body.classList.toggle('dark');LS.s('vizkor_dark',document.body.classList.contains('dark'))};if(LS.g('vizkor_dark',false))document.body.classList.add('dark');
$('#randomAudio').onclick=()=>{const v=pick(data().vocab);if(v)speak(v.ko)};
$$('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));
function go(v){S.view=v;S.q='';S.book='ALL';S.pos='ALL';S.category='ALL';S.page=1;S.sentenceQ='';S.sentencePage=1;S.keywordQ='';S.keywordPage=1;$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));setSidebar(false);render()}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);const sp=e.target.closest('[data-speak]');if(sp)speak(sp.dataset.speak);const f=e.target.closest('[data-fav]');if(f){const p=P(),k=f.dataset.fav;p.fav[k]=!p.fav[k];save(p);f.textContent=p.fav[k]?'❤️':'♡'}});
function formText(v){if(!v.present&&!v.past&&!v.future)return '';return `<div class="forms"><b>Present:</b> ${esc(v.present?.ko||'—')}<br><b>Past:</b> ${esc(v.past?.ko||'—')}<br><b>Future:</b> ${esc(v.future?.ko||'—')}</div>`}
function card(v){const p=P(),k=key(v);return `<div class="card vcard"><div class="miniActions"><button class="mini" data-fav="${esc(k)}" title="Favorite">${p.fav[k]?'❤️':'♡'}</button><button class="mini" data-speak="${esc(v.ko)}" title="Play Korean">🔊</button></div><div class="ko">${esc(v.ko)}</div><div class="meaning"><b>${esc(v.en)}</b>${v.tl?`<br><span class="muted">${esc(v.tl)}</span>`:''}</div><div class="pills"><span class="pill">${esc(v.book||'GENERAL')}</span><span class="pill">${esc(v.pos||'Vocabulary')}</span>${v.page?`<span class="pill">Page ${v.page}</span>`:''}${v.category?`<span class="pill">${esc(v.category)}</span>`:''}</div>${formText(v)}</div>`}
function deterministicDaily(arr,count=8){if(!arr.length)return[];const day=new Date().toISOString().slice(0,10);let seed=0;for(const c of day)seed=(seed*31+c.charCodeAt(0))>>>0;const scored=arr.map((x,i)=>({x,s:((seed^(i*2654435761))>>>0)}));scored.sort((a,b)=>a.s-b.s);return scored.slice(0,count).map(z=>z.x)}
function loadStateMessage(){const st=window.VIZKOR_REPO_STATUS||{};if(st.state==='error')return `<div class="errorBox" style="margin-bottom:14px"><b>Data loading error.</b> Open Data Health to see which source failed.</div>`;return ''}
function dashboard(){const D=data(),p=P(),st=window.VIZKOR_REPO_STATUS||{},c=st.counts||{},acc=p.answered?Math.round(p.correct/p.answered*100):0,daily=deterministicDaily(D.vocab,8),state=st.state||'loading';title('Dashboard',state==='ready'?`${D.vocab.length} corrected entries loaded`:'Loading corrected EPSReg banks…');return `${loadStateMessage()}<div class="hero"><h1>VIZKOR Full EPS-TOPIK Reviewer</h1><p>Corrected Book 1 + Book 2 vocabulary parsing, nouns, verb/adjective conjugations, adverbs, greetings, EPS keywords, sentences, listening, quizzes, numbers and progress — in one standalone V2.</p><div class="status"><span class="dot ${state==='ready'?'ready':state==='error'?'error':''}"></span>${state==='ready'?'Repository data ready':state==='error'?'Some data failed to load':'Syncing repository data'}</div></div><div class="grid stats"><div class="stat"><span class="muted">Book 1 RAW</span><div class="n">${c.b1Raw||0}</div></div><div class="stat"><span class="muted">Book 2 RAW</span><div class="n">${c.b2Raw||0}</div></div><div class="stat"><span class="muted">Full Vocabulary</span><div class="n">${D.vocab.length}</div></div><div class="stat"><span class="muted">Sentences</span><div class="n">${D.sentences.length}</div></div><div class="stat"><span class="muted">Accuracy</span><div class="n">${acc}%</div></div></div><div class="grid bookCards"><div class="card bookCard"><span class="badge">BOOK 1</span><h3>EPS-TOPIK Book 1</h3><p class="muted">Everyday Korean, people, places, daily life, public services and core workplace language.</p><button class="btn" data-go="vocab" data-book-shortcut="B1">Study Book 1</button></div><div class="card bookCard"><span class="badge">BOOK 2</span><h3>EPS-TOPIK Book 2</h3><p class="muted">Workplace culture, industry, safety, labor systems, manufacturing and specialized vocabulary.</p><button class="btn" data-go="vocab" data-book-shortcut="B2">Study Book 2</button></div></div><div class="section"><h2>Study Center</h2><small class="muted">Choose a mode</small></div><div class="grid quick">${[['vocab','📚','Vocabulary','Book 1 + Book 2 searchable list'],['verbs','⚙️','Verb Conjugation','Base, present, past and future'],['flash','🃏','Flashcards','Filtered memory training'],['quiz','🧠','Quiz','Unique choices + wrong-answer review'],['listening','🔊','Listening','Hear Korean before choosing'],['numbers','🔢','Numbers','Native, Sino, time, counters, dates'],['sentences','📝','Sentences','Full paginated sentence bank'],['reading','📖','EPS Keywords','High-frequency exam language']].map(x=>`<div class="card" data-go="${x[0]}"><div class="emoji">${x[1]}</div><h3>${x[2]}</h3><div class="muted">${x[3]}</div></div>`).join('')}</div><div class="section"><h2>Daily 8</h2><small class="muted">Stable for today</small></div><div class="grid vgrid">${daily.map(card).join('')||'<div class="empty">Loading vocabulary…</div>'}</div><div class="footer">V2.1 keeps the original site untouched. Korean TTS quality depends on the Korean voice installed on your browser/device.</div>`}
function getListArray(kind){const D=data();if(kind==='vocab')return D.vocab;return D[kind]||[]}
function listFiltered(kind){let arr=getListArray(kind);const q=S.q.toLowerCase();return arr.filter(v=>(S.book==='ALL'||v.book===S.book)&&(S.pos==='ALL'||v.pos===S.pos)&&(S.category==='ALL'||v.category===S.category)&&(!q||[v.ko,v.en,v.tl,v.category,v.pos,v.page].join(' ').toLowerCase().includes(q)))}
function listView(kind,label){const arr=getListArray(kind),cats=[...new Set(arr.map(x=>x.category).filter(Boolean))].sort(),poses=[...new Set(arr.map(x=>x.pos).filter(Boolean))].sort();title(label,`${arr.length} loaded entries`);return `${loadStateMessage()}<div class="controls"><input class="input" id="search" placeholder="Search Korean, English, Tagalog…" value="${esc(S.q)}"><select class="select" id="book"><option value="ALL">All books</option><option value="B1">Book 1</option><option value="B2">Book 2</option><option value="GENERAL">General</option></select>${kind==='vocab'?`<select class="select" id="pos"><option value="ALL">All types</option>${poses.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`:''}${cats.length?`<select class="select" id="category"><option value="ALL">All categories</option>${cats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`:''}<select class="select" id="per"><option value="30">30 / page</option><option value="60">60 / page</option><option value="100">100 / page</option></select><button class="btn sec" id="randomWord">🔀 Random</button></div><div class="small muted" id="resultCount"></div><div class="grid vgrid" id="listGrid" style="margin-top:10px"></div><div class="pager"><button class="btn sec" id="prevPage">←</button><b id="pageInfo">1 / 1</b><button class="btn sec" id="nextPage">→</button></div>`}
function refreshList(kind){const filtered=listFiltered(kind),pages=Math.max(1,Math.ceil(filtered.length/S.per));S.page=Math.min(Math.max(1,S.page),pages);const shown=filtered.slice((S.page-1)*S.per,S.page*S.per);$('#resultCount').textContent=`${filtered.length} matching entries`;$('#listGrid').innerHTML=shown.map(card).join('')||'<div class="empty">No matching entries. Clear or change the filters.</div>';$('#pageInfo').textContent=`${S.page} / ${pages}`;$('#prevPage').disabled=S.page<=1;$('#nextPage').disabled=S.page>=pages}
function bindList(kind){const search=$('#search'),book=$('#book'),pos=$('#pos'),cat=$('#category'),per=$('#per');book.value=S.book;if(pos)pos.value=S.pos;if(cat)cat.value=S.category;per.value=String(S.per);search.oninput=()=>{S.q=search.value;S.page=1;refreshList(kind)};book.onchange=()=>{S.book=book.value;S.page=1;refreshList(kind)};if(pos)pos.onchange=()=>{S.pos=pos.value;S.page=1;refreshList(kind)};if(cat)cat.onchange=()=>{S.category=cat.value;S.page=1;refreshList(kind)};per.onchange=()=>{S.per=Number(per.value);S.page=1;refreshList(kind)};$('#randomWord').onclick=()=>{const v=pick(listFiltered(kind));if(v)speak(v.ko)};$('#prevPage').onclick=()=>{S.page--;refreshList(kind)};$('#nextPage').onclick=()=>{S.page++;refreshList(kind)};refreshList(kind)}
function flashPool(){return data().vocab.filter(v=>(S.flashBook==='ALL'||v.book===S.flashBook)&&(S.flashPos==='ALL'||v.pos===S.flashPos))}
function flashFilterControls(){return `<select class="select" id="flashBook"><option value="ALL">All books</option><option value="B1">Book 1</option><option value="B2">Book 2</option><option value="GENERAL">General</option></select><select class="select" id="flashPos"><option value="ALL">All types</option>${[...new Set(data().vocab.map(x=>x.pos).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`}
function flash(){const a=flashPool();if(!a.length){title('Flashcards','No entries for this filter');return `<div class="controls">${flashFilterControls()}</div><div class="empty">No cards. Change the filters.</div>`}S.flashIndex=Math.min(S.flashIndex,a.length-1);const v=a[S.flashIndex];title('Flashcards',`${a.length} cards in current filter`);return `<div class="controls">${flashFilterControls()}<button class="btn sec" id="prevFlash">← Previous</button><button class="btn" id="shuffleFlash">Shuffle</button><button class="btn sec" id="nextFlash">Next →</button></div><div class="card flash ${S.flashReveal?'reveal':''}" id="flashCard"><div><div class="big">${esc(v.ko)}</div><div class="muted">${S.flashReveal?esc(v.pos||'Vocabulary'):'Tap the card to reveal'}</div><div class="answer"><h2>${esc(v.en)}</h2><div class="muted">${esc(v.tl||'')}</div>${formText(v)}<p><button class="btn" data-speak="${esc(v.ko)}">🔊 Hear Korean</button></p></div></div></div>`}
function bindFlash(){const a=flashPool(),fb=$('#flashBook'),fp=$('#flashPos');fb.value=S.flashBook;fp.value=S.flashPos;fb.onchange=()=>{S.flashBook=fb.value;S.flashIndex=0;S.flashReveal=false;render()};fp.onchange=()=>{S.flashPos=fp.value;S.flashIndex=0;S.flashReveal=false;render()};const fc=$('#flashCard');if(!fc)return;fc.onclick=e=>{if(e.target.closest('button'))return;S.flashReveal=!S.flashReveal;fc.classList.toggle('reveal',S.flashReveal);const m=fc.querySelector('.muted');if(m)m.textContent=S.flashReveal?(a[S.flashIndex].pos||'Vocabulary'):'Tap the card to reveal'};$('#prevFlash').onclick=()=>{S.flashIndex=(S.flashIndex-1+a.length)%a.length;S.flashReveal=false;render()};$('#nextFlash').onclick=()=>{S.flashIndex=(S.flashIndex+1)%a.length;S.flashReveal=false;render()};$('#shuffleFlash').onclick=()=>{S.flashIndex=Math.floor(Math.random()*a.length);S.flashReveal=false;render()}}
function quizPool(){return data().vocab.filter(v=>v.en&&v.ko&&(S.quizBook==='ALL'||v.book===S.quizBook)&&(S.quizPos==='ALL'||v.pos===S.quizPos))}
function makeQ(){const pool=quizPool();if(!pool.length)return null;const v=pick(pool);const candidates=unique(shuffle(data().vocab.filter(x=>x.en&&x.ko&&clean(x.en).toLowerCase()!==clean(v.en).toLowerCase())),x=>clean(x.en).toLowerCase()).slice(0,3);if(candidates.length<3)return null;return {v,opts:shuffle([v,...candidates]),done:false}}
function quiz(listen=false){const mode=listen?'listen':'quiz';if(!S[mode])S[mode]=makeQ();const q=S[mode];title(listen?'Listening Quiz':'4-Choice Quiz',listen?'Listen first, then choose':'Korean → English meaning');return `<div class="quizWrap"><div class="controls"><select class="select" id="quizBook"><option value="ALL">All books</option><option value="B1">Book 1</option><option value="B2">Book 2</option><option value="GENERAL">General</option></select><select class="select" id="quizPos"><option value="ALL">All types</option>${[...new Set(data().vocab.map(x=>x.pos).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><button class="btn sec" id="newQuiz">New Question</button></div>${q?`<div class="card qcard"><div class="muted">${listen?'Press play and listen carefully':'Choose the correct meaning'}</div><div class="qmain">${listen?'🔊 듣기':esc(q.v.ko)}</div><p><button class="btn sec" data-speak="${esc(q.v.ko)}">🔊 Play Korean</button></p><div class="choices">${q.opts.map((x,i)=>`<button class="choice" data-answer="${esc(x.en)}">${String.fromCharCode(65+i)}. ${esc(x.en)}</button>`).join('')}</div><div id="feedback"></div></div>`:'<div class="empty">Not enough unique vocabulary choices for this filter. Change the filter.</div>'}</div>`}
function answer(btn,q,mode){if(!q||q.done)return;q.done=true;const ok=clean(btn.dataset.answer).toLowerCase()===clean(q.v.en).toLowerCase(),p=P(),k=key(q.v);p.answered++;if(ok){p.correct++;p.mastered[k]=(p.mastered[k]||0)+1;delete p.wrong[k]}else p.wrong[k]={...q.v};save(p);$$('.choice').forEach(x=>{if(clean(x.dataset.answer).toLowerCase()===clean(q.v.en).toLowerCase())x.classList.add('good');else if(x===btn)x.classList.add('bad');x.disabled=true});$('#feedback').innerHTML=`<div class="notice" style="margin-top:12px">${ok?'✅ Correct':`❌ Correct answer: <b>${esc(q.v.en)}</b>`}<br><span class="small">${esc(q.v.ko)}${q.v.tl?' • '+esc(q.v.tl):''}</span><br><br><button class="btn" id="nextQ">Next Question</button></div>`;$('#nextQ').onclick=()=>{S[mode]=makeQ();render()}}
function bindQuiz(listen){const mode=listen?'listen':'quiz',qb=$('#quizBook'),qp=$('#quizPos');qb.value=S.quizBook;qp.value=S.quizPos;const reset=()=>{S[mode]=makeQ();render()};qb.onchange=()=>{S.quizBook=qb.value;S[mode]=null;reset()};qp.onchange=()=>{S.quizPos=qp.value;S[mode]=null;reset()};$('#newQuiz').onclick=reset;$$('.choice').forEach(b=>b.onclick=()=>answer(b,S[mode],mode))}
const nativeUnits=['','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'];const nativeTens=['','','스물','서른','마흔','쉰','예순','일흔','여든','아흔'];
function native(n){n=Number(n);if(n===0)return'영';if(n<10)return nativeUnits[n];if(n<20)return n===10?'열':'열'+nativeUnits[n-10];const t=Math.floor(n/10),u=n%10;return nativeTens[t]+(u?nativeUnits[u]:'')}
function nativeCounter(n){n=Number(n);if(n===1)return'한';if(n===2)return'두';if(n===3)return'세';if(n===4)return'네';if(n===20)return'스무';if(n>20&&n<30){const u=n%10;return'스물'+({1:'한',2:'두',3:'세',4:'네'}[u]||nativeUnits[u])}return native(n)}
function sino(n){n=Number(n);if(n===0)return'영';const d=['','일','이','삼','사','오','육','칠','팔','구'];let out='';for(const [unit,label] of [[10000,'만'],[1000,'천'],[100,'백'],[10,'십']]){const q=Math.floor(n/unit);if(q){out+=(q===1?'':sino(q))+label;n%=unit}}return out+(n?d[n]:'')}
function newNumberQuestion(){if(S.numMode==='native'){const n=1+Math.floor(Math.random()*99);return{prompt:String(n),answer:native(n)}}if(S.numMode==='sino'){const n=1+Math.floor(Math.random()*9999);return{prompt:n.toLocaleString(),answer:sino(n)}}if(S.numMode==='time'){const h=1+Math.floor(Math.random()*12),m=Math.floor(Math.random()*60);return{prompt:`${h}:${String(m).padStart(2,'0')}`,answer:`${nativeCounter(h)} 시${m?' '+sino(m)+' 분':''}`}}if(S.numMode==='counter'){const n=1+Math.floor(Math.random()*30),types=[['people','명'],['items','개'],['animals','마리'],['bottles','병'],['age','살']],t=pick(types);return{prompt:`${n} ${t[0]}`,answer:`${nativeCounter(n)} ${t[1]}`}}const y=2020+Math.floor(Math.random()*10),m=1+Math.floor(Math.random()*12),d=1+Math.floor(Math.random()*28);return{prompt:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,answer:`${sino(y)} 년 ${sino(m)} 월 ${sino(d)} 일`}}
function numbers(){if(!S.numQuestion)S.numQuestion=newNumberQuestion();const q=S.numQuestion;title('Number Trainer','Correct Native • Sino • Time • Counters • Dates');return `<div class="tabs">${[['native','Native'],['sino','Sino'],['time','Time'],['counter','Counters'],['date','Date']].map(x=>`<button data-num="${x[0]}" class="${S.numMode===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="card numberBox"><div class="num">${esc(q.prompt)}</div><button class="btn" id="showNum">Show Korean</button><div id="numAnswer" style="display:none"><h2>${esc(q.answer)}</h2><button class="btn sec" data-speak="${esc(q.answer)}">🔊 Hear</button> <button class="btn" id="nextNum">Next</button></div></div><div class="notice" style="margin-top:14px"><b>Time correction:</b> 1:00 = <b>한 시</b>, 2:00 = <b>두 시</b>, 3:00 = <b>세 시</b>, 4:00 = <b>네 시</b> — not 하나/둘/셋/넷 시.</div>`}
function bindNumbers(){$$('[data-num]').forEach(b=>b.onclick=()=>{S.numMode=b.dataset.num;S.numQuestion=newNumberQuestion();render()});$('#showNum').onclick=()=>{$('#showNum').style.display='none';$('#numAnswer').style.display='block'};$('#nextNum').onclick=()=>{S.numQuestion=newNumberQuestion();render()}}
function sentenceFiltered(){const q=S.sentenceQ.toLowerCase();return data().sentences.filter(x=>(S.sentenceLevel==='ALL'||x.level===S.sentenceLevel)&&(!q||[x.ko,x.en,x.tl].join(' ').toLowerCase().includes(q)))}
function sentences(){title('Sentence Practice',`${data().sentences.length} total sentences loaded`);return `<div class="controls"><input class="input" id="sentenceSearch" placeholder="Search sentence…" value="${esc(S.sentenceQ)}"><select class="select" id="sentenceLevel"><option value="ALL">All levels</option><option value="basic">Basic</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></div><div class="small muted" id="sentenceCount"></div><div class="grid vgrid" id="sentenceGrid" style="margin-top:10px"></div><div class="pager"><button class="btn sec" id="prevSentence">←</button><b id="sentencePageInfo">1 / 1</b><button class="btn sec" id="nextSentence">→</button></div>`}
function refreshSentences(){const a=sentenceFiltered(),pages=Math.max(1,Math.ceil(a.length/S.sentencePer));S.sentencePage=Math.min(Math.max(1,S.sentencePage),pages);const shown=a.slice((S.sentencePage-1)*S.sentencePer,S.sentencePage*S.sentencePer);$('#sentenceCount').textContent=`${a.length} matching sentences`;$('#sentenceGrid').innerHTML=shown.map(x=>`<div class="card vcard"><div class="miniActions"><button class="mini" data-speak="${esc(x.ko)}">🔊</button></div><div class="ko">${esc(x.ko)}</div><div class="meaning"><b>${esc(x.en)}</b>${x.tl?`<br><span class="muted">${esc(x.tl)}</span>`:''}</div><span class="pill">${esc(x.level)}</span></div>`).join('')||'<div class="empty">No matching sentences.</div>';$('#sentencePageInfo').textContent=`${S.sentencePage} / ${pages}`;$('#prevSentence').disabled=S.sentencePage<=1;$('#nextSentence').disabled=S.sentencePage>=pages}
function bindSentences(){const ss=$('#sentenceSearch'),sl=$('#sentenceLevel');sl.value=S.sentenceLevel;ss.oninput=()=>{S.sentenceQ=ss.value;S.sentencePage=1;refreshSentences()};sl.onchange=()=>{S.sentenceLevel=sl.value;S.sentencePage=1;refreshSentences()};$('#prevSentence').onclick=()=>{S.sentencePage--;refreshSentences()};$('#nextSentence').onclick=()=>{S.sentencePage++;refreshSentences()};refreshSentences()}
function keywordFiltered(){const q=S.keywordQ.toLowerCase();return data().keywords.filter(x=>!q||[x.ko,x.en,x.tl,x.koSentence,x.enSentence].join(' ').toLowerCase().includes(q))}
function reading(){title('EPS Reading Keywords',`${data().keywords.length} high-frequency keywords`);return `<div class="notice"><b>Exam strategy:</b> identify instruction/negative words first, then scan the sentence or passage for numbers, time, place, safety, prohibition, and relationship keywords.</div><div class="controls" style="margin-top:14px"><input class="input" id="keywordSearch" placeholder="Search keyword or example…" value="${esc(S.keywordQ)}"></div><div class="small muted" id="keywordCount"></div><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Korean</th><th>English</th><th>Tagalog</th><th>Frequency</th><th>Example</th></tr></thead><tbody id="keywordBody"></tbody></table></div><div class="pager"><button class="btn sec" id="prevKeyword">←</button><b id="keywordPageInfo">1 / 1</b><button class="btn sec" id="nextKeyword">→</button></div>`}
function refreshKeywords(){const a=keywordFiltered(),pages=Math.max(1,Math.ceil(a.length/S.keywordPer));S.keywordPage=Math.min(Math.max(1,S.keywordPage),pages);const shown=a.slice((S.keywordPage-1)*S.keywordPer,S.keywordPage*S.keywordPer);$('#keywordCount').textContent=`${a.length} matching keywords`;$('#keywordBody').innerHTML=shown.map(x=>`<tr><td><b>${esc(x.ko)}</b> <button class="mini" data-speak="${esc(x.ko)}">🔊</button></td><td>${esc(x.en)}</td><td>${esc(x.tl)}</td><td>${x.count||''}</td><td>${esc(x.koSentence||'')}</td></tr>`).join('');$('#keywordPageInfo').textContent=`${S.keywordPage} / ${pages}`;$('#prevKeyword').disabled=S.keywordPage<=1;$('#nextKeyword').disabled=S.keywordPage>=pages}
function bindKeywords(){const ks=$('#keywordSearch');ks.oninput=()=>{S.keywordQ=ks.value;S.keywordPage=1;refreshKeywords()};$('#prevKeyword').onclick=()=>{S.keywordPage--;refreshKeywords()};$('#nextKeyword').onclick=()=>{S.keywordPage++;refreshKeywords()};refreshKeywords()}
function review(fav){const p=P(),arr=fav?data().vocab.filter(v=>p.fav[key(v)]):Object.values(p.wrong);title(fav?'Favorites':'Wrong Answers',`${arr.length} saved terms`);return `<div class="grid vgrid">${arr.map(card).join('')||'<div class="empty">Nothing here yet.</div>'}</div>`}
function progress(){const p=P(),acc=p.answered?Math.round(p.correct/p.answered*100):0,mastered=Object.keys(p.mastered).length,total=Math.max(1,data().vocab.length),pct=Math.min(100,Math.round(mastered/total*100));title('Progress','Saved locally on this device');return `<div class="grid stats"><div class="stat"><span class="muted">Answered</span><div class="n">${p.answered}</div></div><div class="stat"><span class="muted">Correct</span><div class="n">${p.correct}</div></div><div class="stat"><span class="muted">Accuracy</span><div class="n">${acc}%</div></div><div class="stat"><span class="muted">Mastered</span><div class="n">${mastered}</div></div><div class="stat"><span class="muted">Weak Words</span><div class="n">${Object.keys(p.wrong).length}</div></div></div><div class="card" style="padding:20px"><b>Vocabulary Mastery</b><p class="muted">${mastered} of ${total} terms answered correctly at least once</p><div class="progressLine"><span style="width:${pct}%"></span></div><p><button class="btn bad" id="resetProgress">Reset V2 Progress</button></p></div>`}
function skills(){title('EPS Skill Test Center','Specialized practice modules from your existing repo');const x=[['Command Practice','../skilltest-command.html','Practice workplace commands'],['Interview Practice','../skilltest-interview.html','EPS interview preparation'],['Signs Practice','../skilltest-sign.html','Safety and workplace signs'],['Tools Practice','../skilltest-tools.html','Tools and equipment recognition'],['Reading Master Guide','../readingguide.html','Full reading exam guide'],['Numbers Full Trainer','../number.html','Original advanced number trainer']];return `<div class="grid skillGrid">${x.map(i=>`<div class="card skill"><h3>${i[0]}</h3><p class="muted">${i[2]}</p><a class="btn" href="${i[1]}">Open Module</a></div>`).join('')}</div>`}
function health(){const st=window.VIZKOR_REPO_STATUS||{},D=data(),sources=Object.entries(st.sources||{}),warnings=st.warnings||[],diag=st.diagnostics||{};title('Data Health',`V2 data engine ${st.version||'—'}`);const koVoices=voices.filter(v=>/^ko(-|_)?/i.test(v.lang)||/Korean/i.test(v.name));return `<div class="grid healthGrid"><div class="stat"><span class="muted">Engine</span><div class="n">${esc(st.version||'—')}</div></div><div class="stat"><span class="muted">Status</span><div class="n" style="font-size:20px">${esc(st.state||'loading')}</div></div><div class="stat"><span class="muted">Full vocab</span><div class="n">${D.vocab.length}</div></div></div><div class="section"><h2>Source Files</h2></div><div class="tableWrap"><table><thead><tr><th>Source</th><th>Status</th><th>Bytes</th></tr></thead><tbody>${sources.map(([name,x])=>`<tr><td>${esc(name)}</td><td class="${x.ok?'sourceOk':'sourceBad'}">${x.ok?'OK':'FAILED'}</td><td>${x.bytes||esc(x.error||'')}</td></tr>`).join('')}</tbody></table></div><div class="section"><h2>Parser Diagnostics</h2></div><div class="grid bookCards"><div class="card bookCard"><h3>Book 1</h3><p>Parsed RAW: <b>${diag.B1?.rawLines||0}</b><br>Skipped non-data lines: <b>${diag.B1?.skipped||0}</b></p></div><div class="card bookCard"><h3>Book 2</h3><p>Parsed RAW: <b>${diag.B2?.rawLines||0}</b><br>Skipped non-data lines: <b>${diag.B2?.skipped||0}</b></p></div></div>${warnings.length?`<div class="section"><h2>Warnings</h2></div><div class="errorBox">${warnings.map(w=>`• ${esc(w)}`).join('<br>')}</div>`:''}<div class="section"><h2>Korean Voice</h2></div><div class="card" style="padding:18px"><p class="muted">Choose an installed Korean voice. If none appears, the browser/device does not currently expose a Korean TTS voice.</p><div class="controls"><select class="select" id="voiceSelect"><option value="">Automatic ko-KR</option>${koVoices.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} — ${esc(v.lang)}</option>`).join('')}</select><button class="btn" id="testVoice">Test: 안녕하세요</button></div></div><div class="notice" style="margin-top:14px"><b>Deep-correction safeguards:</b> multi-word Korean RAW terms are preserved; stray legacy jamo prefixes are removed; Book/page details are matched with meaning-aware scoring; duplicate action verbs are not shown as adjectives when the same verb record exists.</div>`}
function bindHealth(){refreshVoices();const s=$('#voiceSelect');if(!s)return;s.value=LS.g('vizkor_ko_voice','');s.onchange=()=>LS.s('vizkor_ko_voice',s.value);$('#testVoice').onclick=()=>speak('안녕하세요')}
function bind(){if(['vocab','nouns','verbs','adjectives','adverbs','expressions'].includes(S.view))bindList(S.view);if(S.view==='flash')bindFlash();if(S.view==='quiz')bindQuiz(false);if(S.view==='listening')bindQuiz(true);if(S.view==='numbers')bindNumbers();if(S.view==='sentences')bindSentences();if(S.view==='reading')bindKeywords();if(S.view==='progress')$('#resetProgress').onclick=()=>{if(confirm('Reset all V2 progress?')){localStorage.removeItem('vizkor_v2_progress');render()}};if(S.view==='health')bindHealth();$$('[data-book-shortcut]').forEach(b=>b.onclick=e=>{e.stopPropagation();go('vocab');S.book=b.dataset.bookShortcut;render()})}
function render(){let h='';if(S.view==='dashboard')h=dashboard();else if(S.view==='vocab')h=listView('vocab','All Vocabulary');else if(S.view==='nouns')h=listView('nouns','Korean Nouns');else if(S.view==='verbs')h=listView('verbs','Korean Verbs + Conjugations');else if(S.view==='adjectives')h=listView('adjectives','Korean Adjectives + Conjugations');else if(S.view==='adverbs')h=listView('adverbs','Korean Adverbs');else if(S.view==='expressions')h=listView('expressions','Greetings & Situational Phrases');else if(S.view==='flash')h=flash();else if(S.view==='quiz')h=quiz(false);else if(S.view==='listening')h=quiz(true);else if(S.view==='numbers')h=numbers();else if(S.view==='sentences')h=sentences();else if(S.view==='reading')h=reading();else if(S.view==='wrong')h=review(false);else if(S.view==='favorites')h=review(true);else if(S.view==='progress')h=progress();else if(S.view==='skills')h=skills();else h=health();$('#content').innerHTML=h;bind()}
window.addEventListener('vizkor:data-ready',()=>{S.quiz=null;S.listen=null;S.numQuestion=null;render()});render();
})();
</script>
