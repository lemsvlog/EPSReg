</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">한</div><div><b>VIZKOR V2</b><small>EPS-TOPIK Learning Hub</small></div></div><div class="nav" id="nav"><button class="active" data-v="dashboard">🏠 Dashboard</button><button data-v="vocab">📚 Vocabulary</button><button data-v="flash">🃏 Flashcards</button><button data-v="quiz">🧠 4-Choice Quiz</button><button data-v="listening">🔊 Listening</button><button data-v="numbers">🔢 Numbers</button><button data-v="sentences">💬 Sentences</button><button data-v="wrong">⭐ Wrong Answers</button><button data-v="favorites">❤️ Favorites</button><button data-v="progress">📊 Progress</button><button data-v="original">🧩 Original Modules</button></div></aside><main class="main"><header class="top"><button class="menu" id="menu">☰</button><div class="title"><b id="title">Dashboard</b><small id="sub">Loading repository data…</small></div><button id="theme">◐</button></header><div class="view" id="view"></div></main></div><script src="repo-sync.js"></script><script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};let S={v:'dashboard',book:'ALL',pos:'ALL',q:'',flash:0,reveal:false,quiz:null,listen:null,num:'native',level:'ALL'};const P=()=>LS.g('vizkor_v2_progress',{answered:0,correct:0,wrong:{},fav:{},mastered:{}}),save=p=>LS.s('vizkor_v2_progress',p),data=()=>window.VIZKOR_DATA?.vocab||[];const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),sh=a=>[...a].sort(()=>Math.random()-.5),pick=a=>a[Math.floor(Math.random()*a.length)];function speak(t){if(!speechSynthesis)return;let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.86;speechSynthesis.cancel();speechSynthesis.speak(u)}function go(v){S.v=v;$$('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('#side').classList.remove('open');render()}$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#theme').onclick=()=>{document.body.classList.toggle('dark');LS.s('vizkor_v2_dark',document.body.classList.contains('dark'))};if(LS.g('vizkor_v2_dark',false))document.body.classList.add('dark');$$('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));document.addEventListener('click',e=>{let s=e.target.closest('[data-speak]');if(s)speak(s.dataset.speak);let f=e.target.closest('[data-fav]');if(f){let p=P(),k=f.dataset.fav;p.fav[k]=!p.fav[k];save(p);render()}});function card(v){let p=P(),k=v.ko+'|'+v.en;return `<div class="card vcard"><button class="fav" data-fav="${esc(k)}">${p.fav[k]?'❤️':'♡'}</button><button class="speak" data-speak="${esc(v.ko)}">🔊</button><div class="ko">${esc(v.ko)}</div><div class="meaning"><b>${esc(v.en)}</b>${v.tl?`<br><span class="muted">${esc(v.tl)}</span>`:''}</div><span class="pill">${esc(v.book||'')}</span><span class="pill">${esc(v.pos||'')}</span>${v.page?`<span class="pill">p.${v.page}</span>`:''}</div>`}function dash(){let a=data(),p=P(),acc=p.answered?Math.round(p.correct/p.answered*100):0,st=window.VIZKOR_REPO_STATUS||{};$('#title').textContent='Dashboard';$('#sub').textContent=st.state==='ready'?`${a.length} synced terms from EPSReg`:'Syncing repository…';return `<div class="hero"><h1>VIZKOR Full EPS-TOPIK Reviewer</h1><p>Your existing Book 1 + Book 2 learning banks are unified here for vocabulary, conjugations, listening, flashcards, quizzes, numbers, sentences, weak-word review and progress tracking.</p></div><div class="grid stats"><div class="stat"><span class="muted">Synced Vocabulary</span><div class="n">${a.length}</div></div><div class="stat"><span class="muted">Answered</span><div class="n">${p.answered}</div></div><div class="stat"><span class="muted">Accuracy</span><div class="n">${acc}%</div></div><div class="stat"><span class="muted">Weak Words</span><div class="n">${Object.keys(p.wrong).length}</div></div></div><div class="section"><h2>Study Modes</h2></div><div class="grid quick">${[['vocab','📚','Vocabulary','Search Book 1 and Book 2.'],['flash','🃏','Flashcards','Tap to reveal meaning.'],['quiz','🧠','4-Choice Quiz','Automatic wrong-answer tracking.'],['listening','🔊','Listening','Hear Korean, choose the meaning.'],['numbers','🔢','Numbers','Native, Sino, time and counters.'],['sentences','💬','Sentences','Practice sentence banks.'],['wrong','⭐','Weak Review','Repeat missed vocabulary.'],['favorites','❤️','Favorites','Save important terms.'],['progress','📊','Progress','Track accuracy and mastery.']].map(x=>`<div class="card" data-g="${x[0]}"><div style="font-size:28px">${x[1]}</div><h3>${x[2]}</h3><div class="muted">${x[3]}</div></div>`).join('')}</div><div class="footer">Korean audio uses the device/browser ko-KR speech voice. Student progress is saved locally on the device in this V2 branch.</div>`}function vocab(){let a=data().filter(v=>(S.book==='ALL'||v.book===S.book)&&(S.pos==='ALL'||v.pos===S.pos)&&(!S.q||[v.ko,v.en,v.tl,v.source].join(' ').toLowerCase().includes(S.q.toLowerCase())));$('#title').textContent='Vocabulary';$('#sub').textContent=`${a.length} matching terms`;return `<div class="controls"><input class="input" id="search" value="${esc(S.q)}" placeholder="Search Korean, English, Tagalog"><select class="select" id="book"><option>ALL</option><option>B1</option><option>B2</option></select><select class="select" id="pos"><option>ALL</option><option>Noun</option><option>Verb</option><option>Adjective</option><option>Adverb</option><option>Expression</option><option>EPS Keyword</option></select></div><div class="grid vgrid">${a.map(card).join('')||'<div class="empty">No matches.</div>'}</div>`}function mkq(pool=data()){let v=pick(pool),opts=sh([v,...sh(data().filter(x=>x.en!==v.en)).slice(0,3)]);return {v,opts,done:false}}function quiz(listen=false){let key=listen?'listen':'quiz';if(!S[key])S[key]=mkq();let q=S[key];$('#title').textContent=listen?'Listening':'4-Choice Quiz';$('#sub').textContent=listen?'Listen first, then answer':'Korean → meaning';return `<div class="quiz"><div class="card qcard"><div class="muted">${listen?'Press play and choose the meaning':'Choose the correct meaning'}</div><div class="qmain">${listen?'🔊 듣기':esc(q.v.ko)}</div>${listen?`<p><button class="btn" id="play">Play Korean</button></p>`:`<p><button class="btn sec" data-speak="${esc(q.v.ko)}">🔊 Hear</button></p>`}<div class="choices">${q.opts.map((o,i)=>`<button class="choice" data-a="${esc(o.en)}">${String.fromCharCode(65+i)}. ${esc(o.en)}</button>`).join('')}</div><div id="fb"></div></div></div>`}function flash(){let a=data();if(!a.length)return '<div class="empty">Loading data…</div>';S.flash=Math.min(S.flash,a.length-1);let v=a[S.flash];$('#title').textContent='Flashcards';$('#sub').textContent='Tap card to reveal';return `<div class="controls"><button class="btn sec" id="prev">← Previous</button><button class="btn" id="rand">Shuffle</button><button class="btn sec" id="next">Next →</button></div><div class="card flash ${S.reveal?'reveal':''}" id="fc"><div><div class="big">${esc(v.ko)}</div><div class="ans"><h2>${esc(v.en)}</h2><div class="muted">${esc(v.tl||'')}</div>${v.present?`<p><b>Present:</b> ${esc(v.present.ko)}<br><b>Past:</b> ${esc(v.past?.ko||'')}<br><b>Future:</b> ${esc(v.future?.ko||'')}</p>`:''}<button class="btn" data-speak="${esc(v.ko)}">🔊 Hear Korean</button></div></div></div>`}const nn=['영','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열','열하나','열둘','열셋','열넷','열다섯','열여섯','열일곱','열여덟','열아홉'];function native(n){if(n<20)return nn[n];let t=['','','스물','서른','마흔','쉰','예순','일흔','여든','아흔'];return t[Math.floor(n/10)]+(n%10?nn[n%10]:'')}function sino(n){if(n===0)return'영';let d=['','일','이','삼','사','오','육','칠','팔','구'],o='';for(let [u,w] of [[1000,'천'],[100,'백'],[10,'십']]){let q=Math.floor(n/u);if(q){o+=(q===1?'':sino(q))+w;n%=u}}return o+(n?d[n]:'')}function numbers(){let n=1+Math.floor(Math.random()*(S.num==='native'?98:999)),a=S.num==='native'?native(n):sino(n);if(S.num==='time'){let h=1+Math.floor(Math.random()*12),m=Math.floor(Math.random()*60);n=`${h}:${String(m).padStart(2,'0')}`;a=native(h)+' 시 '+(m?sino(m)+' 분':'')}if(S.num==='counter'){let x=1+Math.floor(Math.random()*20),sp={1:'한',2:'두',3:'세',4:'네',20:'스무'};n=x+' people';a=(sp[x]||native(x))+' 명'}$('#title').textContent='Number Trainer';$('#sub').textContent='Native • Sino • Time • Counters';return `<div class="tabs">${[['native','Native'],['sino','Sino'],['time','Time'],['counter','Counters']].map(x=>`<button data-num="${x[0]}" class="${S.num===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="card"><div class="num">${esc(n)}</div><div style="text-align:center;padding-bottom:28px"><button class="btn" id="show">Show Korean</button><div id="na" style="display:none"><h2>${esc(a)}</h2><button class="btn sec" data-speak="${esc(a)}">🔊 Hear</button> <button class="btn" id="new">Next</button></div></div></div>`}function sentences(){let a=window.VIZKOR_DATA?.sentences||[];$('#title').textContent='Sentences';$('#sub').textContent=`${a.length} synced sentence entries`;return `<div class="grid vgrid">${a.slice(0,500).map(v=>`<div class="card vcard"><button class="speak" data-speak="${esc(v.ko)}">🔊</button><div class="ko">${esc(v.ko)}</div><div class="meaning"><b>${esc(v.en)}</b><br><span class="muted">${esc(v.tl||'')}</span></div><span class="pill">${esc(v.level||'Sentence')}</span></div>`).join('')||'<div class="empty">No parsable sentence bank found yet.</div>'}</div>`}function wrong(fav=false){let p=P(),a=fav?data().filter(v=>p.fav[v.ko+'|'+v.en]):Object.values(p.wrong);$('#title').textContent=fav?'Favorites':'Wrong Answers';$('#sub').textContent=`${a.length} terms`;return `<div class="grid vgrid">${a.map(card).join('')||'<div class="empty">Nothing here yet.</div>'}</div>`}function progress(){let p=P(),acc=p.answered?Math.round(p.correct/p.answered*100):0;$('#title').textContent='Progress';$('#sub').textContent='Saved on this device';return `<div class="grid stats"><div class="stat"><span class="muted">Answered</span><div class="n">${p.answered}</div></div><div class="stat"><span class="muted">Correct</span><div class="n">${p.correct}</div></div><div class="stat"><span class="muted">Accuracy</span><div class="n">${acc}%</div></div><div class="stat"><span class="muted">Mastered</span><div class="n">${Object.keys(p.mastered).length}</div></div></div><button class="btn" id="reset">Reset Progress</button>`}function original(){$('#title').textContent='Original Modules';$('#sub').textContent='Existing EPSReg pages remain available';let a=[['Book 1','../book1.html'],['Book 2','../book2.html'],['Nouns','../noun.HTML'],['Verbs','../Verbbasic.html'],['Adjectives','../adjective.html'],['Adverbs','../adverb.html'],['Numbers','../number.html'],['Greetings','../greetings.html'],['Reading Guide','../readingguide.html'],['Sentences','../sentence.html']];return `<div class="notice">V2 does not delete your original modules. Use these while comparing content during migration.</div><div class="grid quick" style="margin-top:15px">${a.map(x=>`<a style="text-decoration:none;color:inherit" href="${x[1]}"><div class="card"><h3>${x[0]}</h3><div class="muted">Open original module</div></div></a>`).join('')}</div>`}function ans(b,q,key){if(q.done)return;q.done=true;let ok=b.dataset.a===q.v.en,p=P(),k=q.v.ko+'|'+q.v.en;p.answered++;if(ok){p.correct++;p.mastered[k]=(p.mastered[k]||0)+1;delete p.wrong[k]}else p.wrong[k]=q.v;save(p);$$('.choice').forEach(x=>{if(x.dataset.a===q.v.en)x.classList.add('good');else if(x===b)x.classList.add('bad');x.disabled=true});$('#fb').innerHTML=`<div class="notice" style="margin-top:12px">${ok?'✅ Correct':`❌ Correct answer: <b>${esc(q.v.en)}</b>`}<br><br><button class="btn" id="nq">Next</button></div>`;$('#nq').onclick=()=>{S[key]=mkq();render()}}function bind(){if(S.v==='dashboard')$$('[data-g]').forEach(x=>x.onclick=()=>go(x.dataset.g));if(S.v==='vocab'){let s=$('#search'),b=$('#book'),p=$('#pos');b.value=S.book;p.value=S.pos;s.oninput=()=>{S.q=s.value;render()};b.onchange=()=>{S.book=b.value;render()};p.onchange=()=>{S.pos=p.value;render()}}if(S.v==='flash'){let a=data();$('#fc').onclick=e=>{if(e.target.closest('button'))return;S.reveal=!S.reveal;render()};$('#prev').onclick=()=>{S.flash=(S.flash-1+a.length)%a.length;S.reveal=false;render()};$('#next').onclick=()=>{S.flash=(S.flash+1)%a.length;S.reveal=false;render()};$('#rand').onclick=()=>{S.flash=Math.floor(Math.random()*a.length);S.reveal=false;render()}}if(S.v==='quiz'||S.v==='listening'){$$('.choice').forEach(b=>b.onclick=()=>ans(b,S[S.v==='quiz'?'quiz':'listen'],S.v==='quiz'?'quiz':'listen'));let p=$('#play');if(p)p.onclick=()=>speak(S.listen.v.ko)}if(S.v==='numbers'){$$('[data-num]').forEach(b=>b.onclick=()=>{S.num=b.dataset.num;render()});$('#show').onclick=()=>{$('#show').style.display='none';$('#na').style.display='block'};let n=$('#new');if(n)n.onclick=render}if(S.v==='progress')$('#reset').onclick=()=>{if(confirm('Reset VIZKOR V2 progress?')){localStorage.removeItem('vizkor_v2_progress');render()}}}function render(){let h=S.v==='dashboard'?dash():S.v==='vocab'?vocab():S.v==='flash'?flash():S.v==='quiz'?quiz(false):S.v==='listening'?quiz(true):S.v==='numbers'?numbers():S.v==='sentences'?sentences():S.v==='wrong'?wrong(false):S.v==='favorites'?wrong(true):S.v==='progress'?progress():original();$('#view').innerHTML=h;bind()}window.addEventListener('vizkor:data-ready',render);render();})();
